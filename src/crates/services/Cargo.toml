[package]
name = "services"
version = "0.1.0"
edition = "2021"

[lib]
path = "./src/lib.rs"

[dependencies]

shared = { path = "../shared/" }

tracing = "0.1"
tracing-subscriber = "0.3"

tokio = { version = "1.39.2", features = ["full"] }
http-body-util = "0.1.2"
reqwest = { version = "0.12.9", features = ["json"] }

async-trait = "0.1.83"

tower = "0.4.13"
serde-env = "0.2.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

colored = "2.1.0"
chrono = "0.4.38"
sysinfo = "0.31.0"
form_urlencoded = "1.2.1"
multimap = "0.10.0"
lazy_static = "1.5.0"
toml = "0.8.19"
merge-struct = "0.1.0"
clap = { version = "4.5.16", features = ["derive"] }
rand = "0.8.5"
queues = "1.1.0"
regex = "1.11.1"
bytes = "1.7.1"

[target.'cfg(unix)'.dependencies]
mpris = "2.0.0"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["combaseapi", "objbase", "winnls","winuser"] }
windows = { version = "0.58.0", features = [
    "Media_Control", 
] }

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }

[build-dependencies]
tonic-build = "0.12.1"
