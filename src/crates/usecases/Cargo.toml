[package]
name = "usecases"
version = "0.1.0"
edition = "2021"

[lib]
path = "./src/lib.rs"

[dependencies]
services = { path = "../services/" }
shared = { path = "../shared/" }
macros = { path = "../macros/" }

schemars = "0.8.21"
hyper = { version = "1.4.1", features = ["full"] }
tokio = { version = "1.39.2", features = ["full"] }
http-body-util = "0.1.2"

parse-display = "0.10.0"

tracing = "0.1"
tracing-subscriber = "0.3"

mlua = { version = "*", features = ["luajit", "vendored"] }

serde_yaml = "0.9.34"
homedir = "0.3.4"
tower = "0.4.13"
serde-env = "0.2.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
colored = "2.1.0"
chrono = "0.4.38"
sysinfo = "0.31.0"
form_urlencoded = "1.2.1"
multimap = "0.10.0"
lazy_static = "1.5.0"
toml = "0.8.19"
merge-struct = "0.1.0"
clap = { version = "4.5.16", features = ["derive"] }
rand = "0.8.5"
queues = "1.1.0"
bytes = "1.7.1"

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }
serde_derive = "=1.0.213"

