[workspace]
members = [
  "src/crates/server",
  "src/crates/services",
  "src/crates/shared",
  "src/crates/macros",
  "src/crates/usecases",
  "src/crates/macros",
  "src/crates/plugin_system",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[package]
name = "asya"
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
mlua = { version = "0.10.3", features = ["lua54", "vendored", "serialize"] }
chrono = "0.4.38"
colored = "2.1.0"
hyper = { version = "1.4.1", features = ["full"] }
tokio = { version = "1.39.2", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0.94"
serde-env = "0.2.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sysinfo = "0.31.0"
form_urlencoded = "1.2.1"
multimap = "0.10.0"
lazy_static = "1.5.0"
toml = "0.8.19"
merge-struct = "0.1.0"
clap = { version = "4.5.16", features = ["derive"] }
rand = "0.8.5"
queues = "1.1.0"
bytes = "1.7.1"
tower = "0.4.13"
dashmap = "*"
serde_yaml = "0.9.34"
homedir = "0.3.4"
http-body-util = "0.1.2"
tracing-appender = "0.2"
ctrlc = { version = "*" }
regex = { version = "*" }
async-trait = "0.1.83"
libloading = "0.8.6"

[dependencies]
server = { path = "src/crates/server" }
services = { path = "src/crates/services" }
shared = { path = "src/crates/shared" }
macros = { path = "src/crates/macros" }
usecases = { path = "src/crates/usecases" }
plugin_system = { path = "src/crates/plugin_system" }

tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-appender = { workspace = true }

ctrlc = { workspace = true }
tokio = { workspace = true }
http-body-util = { workspace = true }

tower = { workspace = true }
serde-env = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }

colored = { workspace = true }
chrono = { workspace = true }
sysinfo = { workspace = true }
form_urlencoded = { workspace = true }
multimap = { workspace = true }
lazy_static = { workspace = true }
toml = { workspace = true }
merge-struct = { workspace = true }
clap = { workspace = true }
rand = { workspace = true }
queues = { workspace = true }

bytes = { workspace = true }

[profile.dev]
lto = "off"
opt-level = 0
incremental = true

[profile.release]
opt-level = 3
lto = "fat"

[profile.profiling]
inherits = "release"
debug = true

[build-dependencies]
tonic-build = "0.12.1"


[features]
dotnet = ["plugin_system/dotnet"]
