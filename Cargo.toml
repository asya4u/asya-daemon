[workspace]
members = [
  "src/crates/server",
  "src/crates/services",
  "src/crates/shared",
  "src/crates/macros",
  "src/crates/usecases",
  "src/crates/macros",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[package]
name = "asya"
version = "0.1.0"
edition = "2021"

[dependencies]
server = { path = "src/crates/server" }
services = { path = "src/crates/services" }
shared = { path = "src/crates/shared" }
macros = { path = "src/crates/macros" }
usecases = { path = "src/crates/usecases" }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

ctrlc = "3.4.5"
tokio = { version = "1.39.2", features = ["full"] }
http-body-util = "0.1.2"

tower = "0.5"
serde-env = "0.2.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

colored = "2.1.0"
chrono = "0.4.38"
sysinfo = "0.33"
form_urlencoded = "1.2.1"
multimap = "0.10.0"
lazy_static = "1.5.0"
toml = "0.8.19"
merge-struct = "0.1.0"
clap = { version = "4.5.16", features = ["derive"] }
rand = "0.8.5"
queues = "1.1.0"

bytes = "1.7.1"

[profile.dev]
lto = "off"
opt-level = 0
incremental = true

[profile.release]
opt-level = 3
lto = "fat"

[profile.profiling]
inherits = "release"
debug = true

[build-dependencies]
tonic-build = "0.12.1"
